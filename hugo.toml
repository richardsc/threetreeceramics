baseURL = 'https://example.org/'
copyright = "© Three Tree Ceramics 2025"
defaultContentLanguage = "en"
disableKinds = ["taxonomy"]
enableRobotsTXT = true
languageCode = "en-us"
timeZone = "America/Halifax"
timeout = "120s"
title = "Three Tree Ceramics"
theme = "gallery"

[params]
  defaultTheme = "dark"
  description = "Three Tree Ceramics - Handmade Pottery"
  title = "Three Tree Ceramics"
  [params.author]
    email = "threetreeceramics@gmail.com"
    name = "Tara Simmonds"
  [params.socialIcons]
    facebook = "https://www.facebook.com/"
    instagram = "https://www.instagram.com/threetreeceramics"
    # github = "https://github.com/nicokaiser/hugo-theme-gallery/"
    # youtube = "https://www.youtube.com/"
    email = "mailto:threetreeceramics@gmail.com"
    #website = "https://example.com"
    #mastodon = "https://example.com"
    #pixelfed = "https://example.com"
    #mixcloud = "https://example.com"
    #flickr = "https://www.flickr.com"
    #500px = "https://500px"
    #whatsapp = "1234567890"
  [params.gallery]
    #boxSpacing = 10
    #targetRowHeight = 288
    #targetRowHeightTolerance = 0.25

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  quality = 75
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

