<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three Tree Ceramics</title>
    
    <!-- Fancy Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f8f8;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            margin-top: 30px;
        }

        .main-image {
            width: 66%;
            margin: 20px auto;
            display: block;
        }

        .secondary-image {
            width: 40%;
            margin: 30px auto;
            display: block;
        }

        .thumbnail-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .thumbnail-row img {
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .thumbnail-row img:hover {
            transform: scale(1.05);
        }

        footer {
            margin: 20px 0;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Welcome to Three Tree Ceramics</h1>

    <!-- Main Image -->
    <img src="threetreelogo.png" alt="Three Tree Ceramics" class="main-image">

    <!-- Secondary Image -->
    <img src="threetreeinfo.png" alt="Three Tree Info" class="secondary-image">

    <!-- Thumbnail Grid -->
    <div class="thumbnail-row">
        <a href="image1.png"><img src="thumb1.png" alt=""></a>
        <a href="image2.png"><img src="thumb2.png" alt=""></a>
        <a href="image3.png"><img src="thumb3.png" alt=""></a>
        <a href="image4.png"><img src="thumb4.png" alt=""></a>
        <a href="image5.png"><img src="thumb5.png" alt=""></a>
        <a href="image6.png"><img src="thumb6.png" alt=""></a>
    </div>

    <footer>
        Copyright Three Tree Ceramics, 2026
    </footer>

</body>
</html>
