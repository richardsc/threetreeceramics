<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three Tree Ceramics</title>
    
    <!-- Fancy Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f8f8;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            margin-top: 30px;
        }

        .main-image {
            width: 45%;
            margin: 20px auto;
            display: block;
        }

        .secondary-image {
            width: 25%;
            margin: 30px auto;
            display: block;
        }

        .thumbnail-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .thumbnail-row img {
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .thumbnail-row img:hover {
            transform: scale(1.05);
        }

        footer {
            margin: 20px 0;
            font-size: 0.9em;
            color: #555;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(0,0,0,0.9);
        }

        .lightbox:target {
            display: block;
        }

        /* Clickable background */
        .lightbox-bg {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        /* Image */
        .lightbox-content {
            max-width: 90%;
            max-height: 85%;
            cursor: default;
        }
    </style>
</head>
<body>

    <h1>Welcome to Three Tree Ceramics</h1>

    <!-- Main Image -->
    <img src="threetreelogo.png" alt="Three Tree Ceramics" class="main-image">

    <!-- Secondary Image -->
    <img src="threetreeinfo.png" alt="Three Tree Info" class="secondary-image">

    <!-- Thumbnails -->
    <div class="thumbnail-row">
        <a href="#img1"><img src="bowl01_thumb.jpeg" alt=""></a>
        <a href="#img2"><img src="bowl02_thumb.jpeg" alt=""></a>
        <a href="#img3"><img src="mug02_thumb.jpeg" alt=""></a>
        <a href="#img4"><img src="mug03_thumb.jpeg" alt=""></a>
        <a href="#img5"><img src="vase02_thumb.jpeg" alt=""></a>
        <a href="#img6"><img src="vase04_thumb.jpeg" alt=""></a>
    </div>

    <!-- Lightboxes -->
    <div id="img1" class="lightbox">
        <a href="#" class="lightbox-bg">
            <img src="bowl01.jpeg" class="lightbox-content">
        </a>
    </div>

    <div id="img2" class="lightbox">
        <a href="#" class="lightbox-bg">
            <img src="bowl02.jpeg" class="lightbox-content">
        </a>
    </div>

    <div id="img3" class="lightbox">
        <a href="#" class="lightbox-bg">
            <img src="mug02.jpeg" class="lightbox-content">
        </a>
    </div>

    <div id="img4" class="lightbox">
        <a href="#" class="lightbox-bg">
            <img src="mug03.jpeg" class="lightbox-content">
        </a>
    </div>

    <div id="img5" class="lightbox">
        <a href="#" class="lightbox-bg">
            <img src="vase02.jpeg" class="lightbox-content">
        </a>
    </div>

    <div id="img6" class="lightbox">
        <a href="#" class="lightbox-bg">
            <img src="vase04.jpeg" class="lightbox-content">
        </a>
    </div>

    <footer>
        Copyright Three Tree Ceramics, 2026
    </footer>

    <!-- Prevent image click from closing -->
    <script>
        document.querySelectorAll('.lightbox-content').forEach(img => {
            img.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    </script>

</body>
</html>
